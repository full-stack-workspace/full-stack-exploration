<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111033"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="mark-bg" x1="30" y1="10" x2="290" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5B4FC"/>
      <stop offset="0.42" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="120" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <radialGradient id="glow-l" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-r" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#818CF8" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="mark-clip">
      <rect x="120" y="150" width="160" height="160" rx="40"/>
    </clipPath>
  </defs>

  <!-- 底色与氛围 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="180" cy="80" rx="420" ry="300" fill="url(#glow-l)"/>
  <ellipse cx="1120" cy="600" rx="460" ry="340" fill="url(#glow-r)"/>

  <!-- 品牌标记:两页对阵 + 中线星火(与 favicon 同构) -->
  <g clip-path="url(#mark-clip)">
    <rect x="120" y="150" width="160" height="160" rx="40" fill="url(#mark-bg)"/>
    <ellipse cx="160" cy="130" rx="80" ry="60" fill="#fff" fill-opacity="0.14"/>
    <rect x="145" y="193" width="45" height="75" rx="12" fill="#C7D2FE" transform="rotate(-9 167.5 230)"/>
    <rect x="210" y="193" width="45" height="75" rx="12" fill="#fff" transform="rotate(9 232.5 230)"/>
    <rect x="188.5" y="208.5" width="23" height="23" rx="5" fill="#FBBF24" transform="rotate(45 200 220)"/>
  </g>

  <!-- 品牌名与英文副标 -->
  <text x="320" y="238" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="76" font-weight="700" fill="url(#title-grad)">React 权衡录</text>
  <text x="322" y="290" font-family="Menlo, SF Mono, monospace" font-size="26" letter-spacing="8" fill="#818CF8">REACT TRADEOFFS</text>

  <!-- slogan -->
  <text x="120" y="420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="40" font-weight="600" fill="#E2E8F0">把生产里的判断，写成可运行的对照</text>

  <!-- 领域清单 -->
  <text x="120" y="492" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="24" fill="#94A3B8">渲染模型 · 状态与通信 · 内部机制 · 性能治理 · RSC · AI-Native · Agent 实战</text>

  <!-- React 原子:对照之外的锚点元素 -->
  <g transform="translate(1020 220)" stroke="#61DAFB" stroke-width="10" fill="none" opacity="0.9">
    <circle r="16" fill="#61DAFB" stroke="none"/>
    <ellipse rx="120" ry="46"/>
    <ellipse rx="120" ry="46" transform="rotate(60)"/>
    <ellipse rx="120" ry="46" transform="rotate(120)"/>
  </g>

  <!-- 底部品牌条 -->
  <rect x="120" y="556" width="56" height="6" rx="3" fill="#6366F1"/>
  <rect x="184" y="556" width="24" height="6" rx="3" fill="#FBBF24"/>
  <text x="228" y="566" font-family="Menlo, SF Mono, monospace" font-size="18" fill="#64748B">react-playground · 专题驱动的生产决策演练</text>
</svg>
