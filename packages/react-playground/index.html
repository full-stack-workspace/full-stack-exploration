<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <meta name="referrer" content="no-referrer-when-downgrade">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="React Playground：把生产里的判断写成可运行的对照。渲染、状态、通信、性能治理、RSC 与 AI-Native，按专题展开。">
    <meta name="keywords" content="React, React 19, Hooks, 组件通信, 性能治理, RSC">

    <title>React Playground · 生产级工程决策</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128" />
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('react-playground:theme:v1');
                var theme = raw ? JSON.parse(raw) : 'light';
                if (theme !== 'light' && theme !== 'dark') theme = 'light';
                document.documentElement.classList.add(theme);
            } catch (e) {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
