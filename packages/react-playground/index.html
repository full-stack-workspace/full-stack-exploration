<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <meta name="referrer" content="no-referrer-when-downgrade">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="按专题组织的 React 19 练习场:对照演示、决策梳理与贴近业务的综合应用,帮助开发者做生产级判断。">
    <meta name="keywords" content="React, React 19, Hooks, 组件通信, Error Boundary, 练习场">

    <title>React Playground · 专题练习场</title>
    <script>
        (function () {
            try {
                var raw = localStorage.getItem('react-playground:theme:v1');
                var theme = raw ? JSON.parse(raw) : 'light';
                if (theme !== 'light' && theme !== 'dark') theme = 'light';
                document.documentElement.classList.add(theme);
            } catch (e) {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
